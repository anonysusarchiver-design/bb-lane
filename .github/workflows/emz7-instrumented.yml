# bb-lane — emz7 instrumented jsshell build + task battery (E-MZ-7).
#
# Builds a SpiderMonkey js shell from the public mirror pinned to a caller-
# supplied commit with a caller-supplied instrumentation patch applied before
# `./mach build`, verifies the EMZ6+EMZ7 probes are in the built binary, then
# runs a caller-supplied task battery under that shell (each task: name,
# base64/z script, args, repeat count, extra env).
#
# Public content only: no secrets, no repo-sourced data, read-only public fetches.
name: emz7-instrumented
run-name: emz7-instrumented ${{ github.event.inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: "run label (a-z0-9-, used in the run title)"
        required: false
        default: "emz7"
      patch_b64:
        description: "instrumentation patch, base64 (optionally `z:`+base64(zlib(data)))"
        required: true
      tasks_b64:
        description: "task battery JSON [{name,script(b64|z:),args?,runs?,env?}], base64 (or z:)"
        required: true
      build_flags:
        description: "configure flags for the source build"
        required: false
        default: "--enable-debug"
      source_rev:
        description: "mirror commit to pin (empty = default-branch HEAD)"
        required: false
        default: "e00a7636053d44c48b523c20b24fde9d3548062a"
      timeout_min:
        description: "job timeout minutes (5-350; debug build + battery needs ~60-180)"
        required: false
        default: "300"

concurrency:
  group: emz7-instrumented
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_min || '300') }}
    env:
      BUILD_FLAGS: ${{ github.event.inputs.build_flags || '--enable-debug' }}
      SRC_REV: ${{ github.event.inputs.source_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner + toolchain probe
        run: |
          set -x
          date -u
          uname -a
          nproc
          free -h | head -2
          df -h / | tail -1
          (clang --version | head -2) || echo "clang: absent"
          python3 --version
          echo "SRC_REV=$SRC_REV"

      - name: Decode instrumentation patch + task battery
        env:
          PATCH_B64: ${{ github.event.inputs.patch_b64 }}
          TASKS_B64: ${{ github.event.inputs.tasks_b64 }}
        run: |
          python3 - <<'PY'
          import base64, os, zlib, json
          def dec(s):
              if s.startswith("z:"):
                  return zlib.decompress(base64.b64decode(s[2:]))
              return base64.b64decode(s)
          patch = dec(os.environ["PATCH_B64"])
          open("emz7-probe.patch", "wb").write(patch)
          tasks = json.loads(dec(os.environ["TASKS_B64"]).decode())
          for t in tasks:
              data = dec(t["script"])
              with open("emz7-task-%s.js" % t["name"], "wb") as f:
                  f.write(data)
          json.dump(tasks, open("emz7-tasks.json", "w"), indent=1)
          print("patch bytes:", len(patch))
          print("tasks:", [(t["name"], t.get("runs", 1), t.get("args", "")) for t in tasks])
          PY
          sha256sum emz7-probe.patch

      - name: Build instrumented shell (pin -> patch -> mach build)
        id: build
        timeout-minutes: 280
        run: |
          set -o pipefail
          bash emz7/build-jsshell.sh "$BUILD_FLAGS" "$PWD/emz7-probe.patch" "$SRC_REV" 2>&1 | tee emz7-build.log

      - name: Verify probes present in built binary
        if: steps.build.outcome == 'success'
        run: |
          set -x
          mkdir -p out
          ls -l jsshell-source/js
          sha256sum jsshell-source/js | tee out/built-binary-sha256.txt
          "$PWD/jsshell-source/js" --version | tee out/built-version.txt
          grep -a -o "EMZ7-PROBE [A-Z0-9]*" jsshell-source/js | sort | uniq -c | tee out/probe-markers-binary.txt || true
          grep -a -o "EMZ6-PROBE [A-Z0-9]*" jsshell-source/js | sort | uniq -c | tee -a out/probe-markers-binary.txt || true
          test -s out/probe-markers-binary.txt || { echo "BINARY-ERROR: probe markers not found in built shell"; exit 1; }
          grep -a -q "EMZ7-PROBE" out/probe-markers-binary.txt || { echo "BINARY-ERROR: EMZ7 probes not found"; exit 1; }
          mkdir -p out/patched-src
          cp mc/js/src/wasm/WasmInstance.cpp out/patched-src/
          cp mc/js/src/wasm/WasmFrameIter.h out/patched-src/
          cp mc/js/src/wasm/WasmFrameIter.cpp out/patched-src/
          cp mc/js/src/wasm/WasmBuiltins.cpp out/patched-src/
          cp mc/js/src/jit/JitFrames.cpp out/patched-src/
          cp mc/js/src/vm/Runtime.cpp out/patched-src/
          cp mc/js/src/gc/GC.cpp out/patched-src/
          cp emz7-probe.patch out/
          cp emz7-task-*.js out/ 2>/dev/null || true
          cp jsshell-patch-sha256.txt out/ 2>/dev/null || true
          cp jsshell-probe-markers.txt out/ 2>/dev/null || true
          cp jsshell-source-rev.txt out/ 2>/dev/null || true
          tail -2000 emz7-build.log > out/emz7-build-tail.txt

      - name: Run task battery under instrumented shell
        id: battery
        if: steps.build.outcome == 'success'
        run: |
          ulimit -c 0 || true
          python3 - <<'PY'
          import json, os, re, subprocess, time
          JS = os.path.abspath("jsshell-source/js")
          tasks = json.load(open("emz7-tasks.json"))
          os.makedirs("out/runs", exist_ok=True)
          summary = []
          for t in tasks:
              name = t["name"]
              script = "emz7-task-%s.js" % name
              args = (t.get("args") or "").split()
              runs = int(t.get("runs") or 1)
              env_extra = t.get("env") or {}
              for i in range(1, runs + 1):
                  env = dict(os.environ)
                  env.update({k: str(v) for k, v in env_extra.items()})
                  t0 = time.time()
                  try:
                      p = subprocess.run(["timeout", "1800", JS, *args, script],
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         timeout=1900, env=env)
                      rc = p.returncode
                      out = p.stdout
                  except subprocess.TimeoutExpired as e:
                      rc = "TIMEOUT"
                      out = e.stdout or b""
                  dt = round(time.time() - t0, 2)
                  fn = "out/runs/%s-%02d.txt" % (name, i)
                  with open(fn, "wb") as f:
                      f.write(out)
                  fams = set()
                  markers = []
                  res_lines = []
                  for ln in out.splitlines():
                      m = re.search(rb"EMZ[67]-PROBE ([A-Z0-9]+)", ln)
                      if m:
                          fams.add(m.group(1).decode())
                          if len(markers) < 4:
                              markers.append(ln.decode("utf8", "replace"))
                      if b"EMZ7-RES:" in ln and len(res_lines) < 10:
                          res_lines.append(ln.decode("utf8", "replace"))
                  last = out.decode("utf8", "replace").splitlines()[-3:]
                  row = {"task": name, "run": i, "rc": rc, "secs": dt,
                         "args": t.get("args", ""), "env": env_extra,
                         "probe": bool(fams), "fams": sorted(fams),
                         "markers": markers, "res": res_lines,
                         "file": fn, "tail": last}
                  summary.append(row)
                  print(json.dumps(row))
          json.dump(summary, open("out/run-summary.json", "w"), indent=1)
          PY

      - name: Assemble evidence
        if: always()
        run: |
          mkdir -p out
          {
            echo "{"
            echo "  \"run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"run_url\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\","
            echo "  \"commit\": \"$GITHUB_SHA\","
            echo "  \"name\": \"${{ github.event.inputs.name }}\","
            echo "  \"build_flags\": \"$BUILD_FLAGS\","
            echo "  \"source_rev\": \"$SRC_REV\","
            echo "  \"date_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > out/meta.json
          cat out/meta.json
          ls -l out/ out/runs 2>/dev/null || true

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emz7-instrumented-evidence
          path: out/
          retention-days: 7
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          B="${{ steps.build.outcome }}"
          echo "build=$B"
          if [ "$B" != "success" ]; then
            echo "VERDICT: instrumented build failed (see emz7-build-tail.txt)"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          s = json.load(open("out/run-summary.json"))
          has_sel_task = any(r["task"] == "selftest" for r in s)
          sel = [r for r in s if r["task"] == "selftest" and "SELFTEST" in r.get("fams", [])]
          if has_sel_task and not sel:
              print("VERDICT: PROBE PIPELINE INVALID - selftest requested but did not fire; do not trust negatives")
              sys.exit(1)
          p0 = sorted({r["task"] for r in s if "P0" in r.get("fams", [])})
          gc = sorted({(r["task"], r["run"]) for r in s
                       if ("P1" in r.get("fams", []) or "P2" in r.get("fams", []))})
          bails = sorted({f for r in s for f in r.get("fams", []) if f in ("G1", "G2", "G3", "G4")})
          g9 = sorted({r["task"] for r in s if "G9" in r.get("fams", [])})
          p23 = sorted({r["task"] for r in s if "P23" in r.get("fams", [])})
          import re as _re
          def _caught_pos(x):
              m = _re.search(r"caught=(\d+)", x)
              return bool(m) and int(m.group(1)) > 0
          caught = sorted({(r["task"], r["run"]) for r in s
                           if r["task"] != "throwref-ctl" and any(_caught_pos(x) for x in r.get("res", []))})
          ctl = sorted({(r["task"], r["run"]) for r in s
                        if r["task"] == "throwref-ctl" and any(_caught_pos(x) for x in r.get("res", []))})
          if has_sel_task:
              print("VERDICT: selftest fired (pipeline OK); battery runs=%d" % len(s))
          else:
              print("VERDICT: selftest canary not in battery; battery runs=%d (build+probe verify still gate)" % len(s))
          print("  P0 map-miss tasks: %s" % (p0 or "none"))
          print("  GC-consumer probe hits: %s" % (gc or "none"))
          print("  GetOrWrapWasmException bail families: %s" % (bails or "none"))
          print("  Catchable (G9) tasks: %s" % (g9 or "none"))
          print("  Handler-search (P23) tasks: %s" % (p23 or "none"))
          print("  Catch-resumes observed (non-control): %s" % (caught or "none"))
          print("  Control-site catch-resumes (throwref-ctl, EXPECTED nonzero): %s" % (ctl or "none"))
          if caught:
              print("=> RESUME OBSERVED: a catch handler resumed for a trapped frame - investigate!")
          elif gc:
              print("=> A1/A2 GAP + resume attempt: GC skipped trapping frame, and no catch resumed (gates closed the path)")
          else:
              print("=> no trap/miss observed in battery (inspect run outputs)")
          sys.exit(0)
          PY
