# bb-lane — a11y5-repro: live repro for C4-S3V2 "wrong-embedder bind"
# (DocAccessibleParent::AddChildDoc accepts a child doc re-bound under a
# valid-shape but ATTACHED OuterDoc that is not the child's actual embedder;
# S3's sketched detached-target guard does not close it. Pinned mirror rev
# e00a7636053d44c48b523c20b24fde9d3548062a).
#
# Self-contained fork of a11y3-repro.yml v1.4 (proven pattern: OPT build ->
# ARM1 5x runs -> ARM2 incremental rebuild with fix + 1 run -> verdict).
# Patches must be committed under a11y5/:
#   a11y5/s3v2-sender.patch - test-only forge (LocalAccessible EVENT_HIDE for
#                             #a11y5-forge: force-flush batch [Hide(O1),
#                             Hide(O2)] then SendBindChildDoc(D2, O3) with O2 =
#                             victim's OuterDoc, D2 = victim's inner doc, O3 =
#                             target iframe's still-attached OuterDoc) +
#                             parent probes (DocAccessibleParent::AddChildDoc
#                             post-bind state line S3V2PROBE with prev-embedder
#                             history).
#   a11y5/s3v2-test.patch   - test_a11y5_forge.html + mochitest.toml entry
#                             (3 srcdoc iframes: forge / victim / target).
#   a11y5/s3v2-fix.patch    - target-identity guard in AddChildDoc (reject a
#                             child doc re-bound under a different OuterDoc
#                             than its recorded embedder; + S3-style detached
#                             check as secondary) (ARM2). Authored against the
#                             sender-patched tree and checked post-apply.
#
# ARM 1: OPT browser + sender/test patches. 5x mochitest-plain runs.
#        Expectation: NO crash; the forged bind is ACCEPTED and the parent
#        probe line for D2 shows embedder=O3, prev-mismatch=1,
#        s3-guard-inert=1, target-prev-differs=1 (wrong-embedder bind; S3's
#        detached-target guard would not fire) -> WRONG-EMBEDDER-BIND-CONFIRMED.
# ARM 2: + s3v2-fix.patch, incremental rebuild, 1 run. Expectation: guard
#        rejects the forged bind ("S3V2PROBE fix rejected wrong-embedder bind")
#        + generic IPC_FAIL signature; no prev-mismatch=1 bind line; normal
#        loads binds still accepted; no parent crash -> GUARD-HELD.
#
# a11y3/a11y4 lessons applied: printf_stderr probes only (NS_WARNING compiled
# out in OPT); ARM steps `set +e` + `|| rc=$?` guards (runner wraps step
# scripts in `bash -e`); patches applied with absolute $GITHUB_WORKSPACE paths
# under `git -C mc`; 0 executed tests = PACKAGING-BLOCKED, never evidence;
# shutdown hangs are expected in this rig (timeout rc=124 + missing SUITE_END)
# and are reported, not fatal; judge by probes + crash cores + markers.
#
# Verdict classes: WRONG-EMBEDDER-BIND-CONFIRMED / INCONCLUSIVE /
# PACKAGING-BLOCKED (+ GUARD-HELD / GUARD FALSIFIED / GUARD INCONCLUSIVE /
# GUARD NO-RESULT).
#
# Public content only: no secrets, read-only public fetches.
name: a11y5-repro
run-name: a11y5-repro ${{ github.event.inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: "run label (a-z0-9-, used in the run title)"
        required: false
        default: "a11y5"
      source_rev:
        description: "mirror commit to pin"
        required: false
        default: "e00a7636053d44c48b523c20b24fde9d3548062a"
      timeout_min:
        description: "job timeout minutes (5-355)"
        required: false
        default: "355"

concurrency:
  group: a11y5-repro
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_min || '355') }}
    env:
      SRC_REV: ${{ github.event.inputs.source_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner probe
        run: |
          set -x
          date -u
          uname -a
          nproc
          free -h | head -2
          df -h / | tail -1
          python3 --version
          echo "SRC_REV=$SRC_REV"

      - name: Build browser (pin + s3v2 sender/test patches + mach OPT build)
        id: build
        timeout-minutes: 265
        run: |
          set -euo pipefail
          exec > >(tee a11y5-build.log) 2>&1
          echo "== runner =="
          date -u
          uname -a
          nproc
          free -h | head -2
          df -h / | tail -1
          (clang --version | head -2) || echo "clang: absent (bootstrap will fetch)"
          python3 --version

          echo "== disk pre-clean =="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h / | tail -1

          echo "== apt system deps (per-package, tolerant) =="
          sudo apt-get update -qq -y
          PKGS=( m4 autoconf2.13 zlib1g-dev unzip uuid-dev pkg-config libgtk-3-dev libdbus-glib-1-dev libpulse-dev libasound2-dev libxt-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcomposite-dev libxdamage-dev libxrender-dev libxfixes-dev libxext-dev libxrandr-dev libglib2.0-dev libdrm-dev gdb xvfb fonts-liberation python3-venv python3-dev )
          for p in "${PKGS[@]}"; do
            sudo apt-get install -y -qq --no-install-recommends "$p" || echo "NOTE: dep install failed (continuing): $p"
          done
          echo "critical probe:"
          (pkg-config --version && gdb --version | head -1 && command -v xvfb-run && echo deps-ok) || true

          echo "== rust toolchain (stable, must be >= MSRV 1.90) =="
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version
          rustup component add llvm-tools-preview || true
          rustup component add rustfmt || true

          echo "== clone pinned source =="
          rm -rf mc
          git clone --depth 1 https://github.com/mozilla-firefox/firefox.git mc
          git -C mc fetch --depth 1 origin "$SRC_REV"
          git -C mc checkout -q FETCH_HEAD
          git -C mc rev-parse HEAD | tee a11y5-source-rev.txt
          git -C mc log -1 --format='%H %s' || true

          echo "== apply test-only patches =="
          # NOTE: -C mc changes cwd for git, so patch paths MUST be absolute (v1.1 fix; run 38181048404 failed here).
          git -C mc apply --check --verbose "$GITHUB_WORKSPACE/a11y5/s3v2-sender.patch"
          git -C mc apply --check --verbose "$GITHUB_WORKSPACE/a11y5/s3v2-test.patch"
          git -C mc apply --verbose "$GITHUB_WORKSPACE/a11y5/s3v2-sender.patch"
          git -C mc apply --verbose "$GITHUB_WORKSPACE/a11y5/s3v2-test.patch"
          echo "-- fix patch must apply on the sender-patched tree (it is applied later, in ARM2) --"
          git -C mc apply --check --verbose "$GITHUB_WORKSPACE/a11y5/s3v2-fix.patch"
          echo "-- patch marker checks (ARM1 build must be FIX-FREE) --"
          grep -n "S3V2 FORGE" mc/accessible/generic/LocalAccessible.cpp | head -3
          grep -n "S3V2PROBE BEGIN" mc/accessible/ipc/DocAccessibleParent.cpp | head -3
          if grep -q "S3V2 FIX-PROBE" mc/accessible/ipc/DocAccessibleParent.cpp; then
            echo "BUILD-ERROR: fix probe present in ARM1 build"; exit 1
          fi
          grep -n "a11y5" mc/testing/mochitest/tests/Harness_sanity/mochitest.toml
          test -f mc/testing/mochitest/tests/Harness_sanity/test_a11y5_forge.html

          echo "== MOZCONFIG =="
          mkdir -p "$HOME/mozconfigs"
          cat > "$HOME/mozconfigs/a11y5" <<EOF
          # generated by a11y5-repro.yml
          ac_add_options --enable-project=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-crashreporter
          ac_add_options --enable-bootstrap
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-a11y5
          EOF
          cat "$HOME/mozconfigs/a11y5"
          export MOZCONFIG="$HOME/mozconfigs/a11y5"
          export MOZBUILD_STATE_PATH="$HOME/.mozbuild"

          echo "== build (mach, browser OPT) =="
          date -u
          cd mc
          ./mach build
          cd ..
          date -u

          BIN="mc/obj-a11y5/dist/bin/firefox"
          test -x "$BIN" || { echo "BUILD-ERROR: firefox binary not found"; exit 1; }
          ls -l "$BIN"
          sha256sum "$BIN" | tee a11y5-binary-sha256.txt
          df -h / | tail -1
          echo "BUILD-OK bin=$(pwd)/$BIN"

      - name: Snapshot patched sources + patches
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p out/patched-src
          sed -n '880,1000p' mc/accessible/generic/LocalAccessible.cpp > out/patched-src/LocalAccessible-EVENT_HIDE.txt
          sed -n '1050,1230p' mc/accessible/ipc/DocAccessibleParent.cpp > out/patched-src/DocAccessibleParent-AddChildDoc.txt
          sed -n '170,200p' mc/accessible/ipc/DocAccessibleParent.h > out/patched-src/DocAccessibleParent-h-Unbind.txt
          sed -n '435,460p' mc/accessible/ipc/DocAccessibleParent.h > out/patched-src/DocAccessibleParent-h-members.txt
          cp mc/testing/mochitest/tests/Harness_sanity/test_a11y5_forge.html out/patched-src/
          cp mc/testing/mochitest/tests/Harness_sanity/mochitest.toml out/patched-src/
          cp a11y5/s3v2-sender.patch a11y5/s3v2-test.patch a11y5/s3v2-fix.patch out/
          sha256sum out/*.patch | tee out/patches-sha256.txt
          mc/obj-a11y5/dist/bin/firefox --version | tee out/built-version.txt || true
          sha256sum mc/obj-a11y5/dist/bin/firefox | tee out/built-binary-sha256.txt
          du -sh mc/obj-a11y5/dist/bin 2>/dev/null || true

      - name: Capture build ID (platform.ini / application.ini)
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p out
          found=""
          for f in mc/obj-*/dist/bin/platform.ini mc/obj-*/dist/bin/application.ini; do
            if [ -f "$f" ]; then
              echo "build-id source: $f" | tee out/buildid.txt
              grep -a -i -E "^(BuildID|Name|Milestone|Version|SourceRepository|SourceStamp)=" "$f" | tee -a out/buildid.txt || true
              cp "$f" out/
              found="yes"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "build-id: neither platform.ini nor application.ini found under mc/obj-*/dist/bin/" | tee out/buildid.txt
            ls -la mc/obj-*/dist/bin/ 2>/dev/null | head -40 || true
          fi
          cat out/buildid.txt

      - name: ARM 1 — 5x runs (expect NO crash + wrong-embedder acceptance transcript)
        id: arm1
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set +e
          set -uo pipefail
          trap '' HUP
          exec > >(tee a11y5-arm1.log) 2>&1
          WORK="$(pwd)"
          OBJDIR_NAME="obj-a11y5"
          BIN="$WORK/mc/$OBJDIR_NAME/dist/bin/firefox"
          TEST="testing/mochitest/tests/Harness_sanity/test_a11y5_forge.html"
          OUT="$WORK/out/arm1"
          mkdir -p "$OUT"
          export MOZCONFIG="$HOME/mozconfigs/a11y5"
          export MOZBUILD_STATE_PATH="$HOME/.mozbuild"
          test -x "$BIN" || { echo "ARM1-ERROR: binary missing: $BIN"; exit 3; }

          echo "== core capture setup =="
          sudo mkdir -p /tmp/cores
          sudo chmod 777 /tmp/cores
          echo '/tmp/cores/core.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
          ulimit -c unlimited || true
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          echo "ulimit -c: $(ulimit -c)"

          crashes=0
          frames=0
          hangs=0
          forge_runs=0
          bind_sent_runs=0
          accept_runs=0
          s3inert_runs=0
          displaced_runs=0
          ipcfail_runs=0
          runs=5
          discovered="yes"
          for i in $(seq 1 $runs); do
            echo "================ ARM1 RUN $i of $runs ================"
            rm -f /tmp/cores/core.* 2>/dev/null || true
            LOG="$OUT/run-$i.log"
            cd "$WORK/mc"
            # v1.4 lesson: the runner wraps this script in `bash -e`; without the
            # `|| rc=$?` guard a non-zero per-run rc (timeout-kill 124 on the
            # shutdown hang) aborts the loop after run 1 (runs 38183150897 /
            # 38191364350). setsid isolates the process group; timeout bounds
            # the hang (default 180s/run).
            rc=0
            setsid timeout -k 10 180 xvfb-run -a -s "-screen 0 1280x1024x24" ./mach mochitest \
              --setpref accessibility.force_disabled=-1 \
              --setpref security.sandbox.content.level=0 \
              "$TEST" > "$LOG" 2>&1 || rc=$?
            cd "$WORK"
            pkill -f "obj-a11y5/dist/bin/firefox" 2>/dev/null || true
            pkill Xvfb 2>/dev/null || true
            sleep 1
            echo "run $i: mochitest rc=$rc"
            hangthis="no"
            if [ "$rc" = "124" ] || ! grep -a -q "SUITE_END" "$LOG"; then hangthis="yes"; fi
            [ "$hangthis" = "yes" ] && hangs=$((hangs+1))

            grep -a 'S3V2PROBE' "$LOG" > "$OUT/run-$i-probes.txt" 2>/dev/null || true
            forge_this="no"
            if grep -a 'S3V2PROBE forge trigger-o1=' "$OUT/run-$i-probes.txt" 2>/dev/null | grep -a -q 'd2-ipcdoc=1' \
               && grep -a 'S3V2PROBE forge trigger-o1=' "$OUT/run-$i-probes.txt" 2>/dev/null | grep -a -q 'target-o3=[1-9]'; then
              forge_this="yes"
            fi
            bs_this="no"
            grep -a -q 'S3V2PROBE forge bind-sent' "$OUT/run-$i-probes.txt" 2>/dev/null && bs_this="yes"
            acc_this="no"
            grep -a 'S3V2PROBE bind ' "$OUT/run-$i-probes.txt" 2>/dev/null | grep -a -q 'prev-mismatch=1' && acc_this="yes"
            s3i_this="no"
            if [ "$acc_this" = "yes" ] && [ "$(grep -a 'S3V2PROBE bind ' "$OUT/run-$i-probes.txt" 2>/dev/null | grep -a -c 's3-guard-inert=1')" != "0" ]; then
              s3i_this="yes"
            fi
            disp_this="no"
            if [ "$acc_this" = "yes" ] && [ "$(grep -a 'S3V2PROBE bind ' "$OUT/run-$i-probes.txt" 2>/dev/null | grep -a -c 'target-prev-differs=1')" != "0" ]; then
              disp_this="yes"
            fi
            ipf_this="no"
            if grep -a -q 'Msg_BindChildDoc' "$LOG" && grep -a -q 'handler returned false' "$LOG"; then ipf_this="yes"; fi
            [ "$forge_this" = "yes" ] && forge_runs=$((forge_runs+1))
            [ "$bs_this" = "yes" ] && bind_sent_runs=$((bind_sent_runs+1))
            [ "$acc_this" = "yes" ] && accept_runs=$((accept_runs+1))
            [ "$s3i_this" = "yes" ] && s3inert_runs=$((s3inert_runs+1))
            [ "$disp_this" = "yes" ] && displaced_runs=$((displaced_runs+1))
            [ "$ipf_this" = "yes" ] && ipcfail_runs=$((ipcfail_runs+1))

            crash="no"
            frame="no"
            if grep -a -q "application terminated with exit code" "$LOG"; then crash="yes"; fi
            ncores=0
            for CORE in $(ls /tmp/cores/core.* 2>/dev/null); do
              ncores=$((ncores+1))
              BTF="$OUT/run-$i-bt-$(basename "$CORE").txt"
              echo "--- core: $CORE ---" > "$BTF"
              file "$CORE" >> "$BTF" 2>&1 || true
              gdb -batch -ex "set pagination off" -ex "bt 60" "$BIN" "$CORE" >> "$BTF" 2>&1 || true
              if grep -q -E "AddChildDoc|RecvBindChildDoc|DocAccessibleParent" "$BTF"; then frame="yes"; crash="yes"; fi
            done
            if [ "$ncores" -gt 0 ]; then crash="yes"; fi
            [ "$crash" = "yes" ] && crashes=$((crashes+1))
            [ "$frame" = "yes" ] && frames=$((frames+1))

            filtered="no"
            if grep -a -q "is not a valid test" "$LOG" || grep -a -q "running 0 tests" "$LOG"; then
              filtered="yes"
              discovered="no"
              echo "run $i: WARNING: mochitest filtered the testcase (0 tests executed) - packaging problem, NOT an outcome"
            fi

            if grep -a -q "TEST-PASS" "$LOG" && grep -a -q "parent process survived" "$LOG"; then
              echo "run $i: test reached the survived-assertion"
            fi

            echo "run $i: cores=$ncores crash=$crash frame=$frame filtered=$filtered forge=$forge_this bind_sent=$bs_this accept=$acc_this s3inert=$s3i_this displaced=$disp_this ipcfail=$ipf_this hang=$hangthis"
            echo "run $i probes:"
            cat "$OUT/run-$i-probes.txt" | sed 's/^/  probe| /'
            echo "run $i tail:"
            tail -n 15 "$LOG" | sed 's/^/  tail| /'
          done

          echo "ARM1 RESULT: crashes=$crashes/$runs frames=$frames/$runs hangs=$hangs/$runs forge_runs=$forge_runs/$runs bind_sent_runs=$bind_sent_runs/$runs accept_runs=$accept_runs/$runs s3inert_runs=$s3inert_runs/$runs displaced_runs=$displaced_runs/$runs ipcfail_runs=$ipcfail_runs/$runs test_discovered=$discovered"
          {
            echo "crashes=$crashes/$runs"
            echo "frames=$frames/$runs"
            echo "hangs=$hangs/$runs"
            echo "forge_runs=$forge_runs/$runs"
            echo "bind_sent_runs=$bind_sent_runs/$runs"
            echo "accept_runs=$accept_runs/$runs"
            echo "s3inert_runs=$s3inert_runs/$runs"
            echo "displaced_runs=$displaced_runs/$runs"
            echo "ipcfail_runs=$ipcfail_runs/$runs"
            echo "test_discovered=$discovered"
          } > "$OUT/result.txt"
          cat "$OUT/result.txt"
          sudo dmesg 2>/dev/null | tail -n 50 > "$OUT/dmesg.txt" || true
          ls -la "$OUT"
          exit 0

      - name: ARM 2 — guard probe + incremental rebuild + 1 run
        id: arm2
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 70
        run: |
          set +e
          set -uo pipefail
          exec > >(tee a11y5-arm2.log) 2>&1
          WORK="$(pwd)"
          OBJDIR_NAME="obj-a11y5"
          BIN="$WORK/mc/$OBJDIR_NAME/dist/bin/firefox"
          TEST="testing/mochitest/tests/Harness_sanity/test_a11y5_forge.html"
          OUT="$WORK/out/arm2"
          mkdir -p "$OUT"
          export MOZCONFIG="$HOME/mozconfigs/a11y5"
          export MOZBUILD_STATE_PATH="$HOME/.mozbuild"
          test -x "$BIN" || { echo "ARM2-ERROR: binary missing: $BIN"; exit 3; }

          echo "== apply fix probe (on the sender-patched tree) =="
          git -C mc apply --verbose "$GITHUB_WORKSPACE/a11y5/s3v2-fix.patch" || { echo "ARM2-ERROR: fix patch failed to apply"; exit 4; }
          grep -n "S3V2 FIX-PROBE" mc/accessible/ipc/DocAccessibleParent.cpp
          grep -n "mLastEmbedderID" mc/accessible/ipc/DocAccessibleParent.h

          echo "== incremental rebuild =="
          date -u
          cd "$WORK/mc"
          ./mach build > "$OUT/rebuild.log" 2>&1
          build_rc=$?
          cd "$WORK"
          date -u
          tail -n 60 "$OUT/rebuild.log"
          if [ "$build_rc" -ne 0 ]; then
            echo "ARM2 BUILD-FAILED rc=$build_rc (full log: out/arm2/rebuild.log)"
            exit 4
          fi
          ls -l "$BIN"
          sha256sum "$BIN" | tee "$OUT/binary-sha256.txt"

          echo "== core capture setup =="
          sudo mkdir -p /tmp/cores
          sudo chmod 777 /tmp/cores
          echo '/tmp/cores/core.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
          ulimit -c unlimited || true
          rm -f /tmp/cores/core.* 2>/dev/null || true

          echo "================ ARM2 RUN (guarded build) ================"
          LOG="$OUT/run-1.log"
          cd "$WORK/mc"
          rc=0
          setsid timeout -k 10 180 xvfb-run -a -s "-screen 0 1280x1024x24" ./mach mochitest \
            --setpref accessibility.force_disabled=-1 \
            --setpref security.sandbox.content.level=0 \
            "$TEST" > "$LOG" 2>&1 || rc=$?
          cd "$WORK"
          pkill -f "obj-a11y5/dist/bin/firefox" 2>/dev/null || true
          pkill Xvfb 2>/dev/null || true
          echo "arm2 run rc=$rc"
          hang="no"
          crash_hint="no"
          if grep -a -q "application terminated with exit code" "$LOG" || grep -a -q "PROCESS-CRASH" "$LOG"; then crash_hint="yes"; fi
          if { [ "$rc" = "124" ] || ! grep -a -q "SUITE_END" "$LOG"; } && [ "$crash_hint" = "no" ]; then hang="yes"; fi
          echo "arm2 run hang=$hang crash_hint=$crash_hint"

          fix_marker="no"
          ipc_fail_sig="no"
          parent_crash="no"
          discovered="yes"

          grep -a -q "S3V2PROBE fix rejected wrong-embedder bind" "$LOG" && fix_marker="yes"
          fix_reject_lines=$(grep -a -c "S3V2PROBE fix rejected wrong-embedder bind" "$LOG" 2>/dev/null || true)
          detached_marker_lines=$(grep -a -c "S3V2PROBE fix rejected detached embedder" "$LOG" 2>/dev/null || true)
          forged_accept_lines=$(grep -a 'S3V2PROBE bind ' "$LOG" 2>/dev/null | grep -a -c 'prev-mismatch=1' || true)
          normal_bind_lines=$(grep -a -c 'S3V2PROBE bind ' "$LOG" 2>/dev/null || true)
          normal_accept_lines=$(grep -a 'S3V2PROBE bind ' "$LOG" 2>/dev/null | grep -a -c 'prev-mismatch=0' || true)
          if grep -a -q "Msg_BindChildDoc" "$LOG" && grep -a -q "handler returned false" "$LOG"; then
            ipc_fail_sig="yes"
          fi
          if grep -a -q "is not a valid test" "$LOG" || grep -a -q "running 0 tests" "$LOG"; then
            discovered="no"
            echo "arm2: WARNING: mochitest filtered the testcase (0 tests executed) - packaging problem"
          fi

          for CORE in $(ls /tmp/cores/core.* 2>/dev/null); do
            BTF="$OUT/run-1-bt-$(basename "$CORE").txt"
            echo "--- core: $CORE ---" > "$BTF"
            file "$CORE" >> "$BTF" 2>&1 || true
            gdb -batch -ex "set pagination off" -ex "bt 60" "$BIN" "$CORE" >> "$BTF" 2>&1 || true
            if grep -q -E "AddChildDoc|RecvBindChildDoc|DocAccessibleParent" "$BTF"; then parent_crash="yes"; fi
          done
          cp /tmp/cores/core.* "$OUT/" 2>/dev/null || true
          grep -a 'S3V2PROBE' "$LOG" > "$OUT/run-1-probes.txt" 2>/dev/null || true

          if grep -a -q "MOZ_CRASHREPORTER_SHUTDOWN" "$LOG"; then
            echo "arm2: MOZ_CRASHREPORTER_SHUTDOWN harness shutdown present (tolerated; judge rejection + no parent crash)"
          fi

          echo "== notable log lines =="
          grep -a -n -E "S3V2PROBE|Msg_BindChildDoc|handler returned false|processing error|Application (ran|terminated|shut down)|Main app process|crashed|exited on signal" "$LOG" | head -n 140 || true

          {
            echo "fix_marker=$fix_marker"
            echo "fix_reject_lines=$fix_reject_lines"
            echo "detached_marker_lines=$detached_marker_lines"
            echo "forged_accept_lines=$forged_accept_lines"
            echo "normal_bind_lines=$normal_bind_lines"
            echo "normal_accept_lines=$normal_accept_lines"
            echo "ipc_fail_sig=$ipc_fail_sig"
            echo "parent_crash=$parent_crash"
            echo "test_discovered=$discovered"
            echo "mochitest_rc=$rc"
            echo "hang=$hang"
          } > "$OUT/result.txt"
          cat "$OUT/result.txt"
          sudo dmesg 2>/dev/null | tail -n 50 > "$OUT/dmesg.txt" || true
          echo "ARM2 DONE"
          exit 0

      - name: Verdict (report-only; never fails the run)
        if: always()
        run: |
          mkdir -p out
          B="${{ steps.build.outcome }}"
          A1="${{ steps.arm1.outcome }}"
          A2="${{ steps.arm2.outcome }}"
          echo "outcomes: build=$B arm1=$A1 arm2=$A2"
          V="VERDICT: UNCLASSIFIED"
          if [ "$B" != "success" ]; then
            V="VERDICT: PACKAGING-BLOCKED (build stage incomplete) - see a11y5-build artifacts / step log"
          elif [ ! -s out/arm1/result.txt ]; then
            V="VERDICT: INCONCLUSIVE (ARM1 produced no result)"
          else
            cat out/arm1/result.txt
            A=$(sed -n 's|^accept_runs=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            SI=$(sed -n 's|^s3inert_runs=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            DP=$(sed -n 's|^displaced_runs=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            FO=$(sed -n 's|^forge_runs=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            BS=$(sed -n 's|^bind_sent_runs=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            C=$(sed -n 's|^crashes=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            H=$(sed -n 's|^hangs=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            IP=$(sed -n 's|^ipcfail_runs=\([0-9]*\)/.*|\1|p' out/arm1/result.txt | head -1)
            D=$(sed -n 's|^test_discovered=\(.*\)$|\1|p' out/arm1/result.txt | head -1)
            A1CLASS="INCONCLUSIVE - inspect arm1 probes (forge=$FO bind_sent=$BS accept=$A)"
            if [ "$D" = "no" ]; then
              A1CLASS="PACKAGING-BLOCKED - mochitest did not execute the testcase (0 runs is NOT evidence)"
            elif [ "${C:-0}" != "0" ]; then
              A1CLASS="INCONCLUSIVE - unexpected ARM1 crashes (${C}/5; accept=${A:-0}/5) - inspect cores"
            elif [ "${A:-0}" != "0" ]; then
              A1CLASS="WRONG-EMBEDDER-BIND-CONFIRMED (forged bind accepted: accept=${A}/5, s3-guard-inert=${SI:-0}/5, target-prev-differs=${DP:-0}/5, forge=${FO:-0}/5, bind_sent=${BS:-0}/5, 0 crashes, hang_runs=${H:-?}/5)"
            elif [ "${BS:-0}" != "0" ]; then
              A1CLASS="INCONCLUSIVE - forged wire sent (bind_sent=${BS}/5) but no prev-mismatch=1 bind line in 5 runs; ipcfail_runs=${IP:-0}; inspect run probes"
            fi
            if [ ! -s out/arm2/result.txt ]; then
              V="VERDICT: ${A1CLASS} + GUARD NO-RESULT - see a11y5 arm2 step log"
            else
              cat out/arm2/result.txt
              FM=$(sed -n 's|^fix_marker=\(.*\)$|\1|p' out/arm2/result.txt | head -1)
              FRL=$(sed -n 's|^fix_reject_lines=\([0-9]*\)$|\1|p' out/arm2/result.txt | head -1)
              GAL=$(sed -n 's|^forged_accept_lines=\([0-9]*\)$|\1|p' out/arm2/result.txt | head -1)
              NBL=$(sed -n 's|^normal_bind_lines=\([0-9]*\)$|\1|p' out/arm2/result.txt | head -1)
              NAL=$(sed -n 's|^normal_accept_lines=\([0-9]*\)$|\1|p' out/arm2/result.txt | head -1)
              PC=$(sed -n 's|^parent_crash=\(.*\)$|\1|p' out/arm2/result.txt | head -1)
              D2=$(sed -n 's|^test_discovered=\(.*\)$|\1|p' out/arm2/result.txt | head -1)
              if [ "$D2" = "no" ]; then
                A2CLASS="GUARD INCONCLUSIVE (ARM2 testcase not executed)"
              elif [ "$PC" = "yes" ]; then
                A2CLASS="GUARD FALSIFIED (parent crashed with guard applied)"
              elif [ "${GAL:-0}" != "0" ]; then
                A2CLASS="GUARD FALSIFIED (forged bind still accepted with guard; prev-mismatch=1 lines=${GAL})"
              elif [ "$FM" = "yes" ] && [ "${NAL:-0}" -ge 2 ]; then
                A2CLASS="GUARD-HELD (fix rejected wrong-embedder bind: lines=${FRL:-?}; normal binds accepted=${NAL}/${NBL}; no forged acceptance; parent survived)"
              else
                A2CLASS="GUARD INCONCLUSIVE (fix_marker=$FM fix_reject_lines=${FRL:-0} normal_accept=${NAL:-0}; inspect arm2 logs)"
              fi
              V="VERDICT: ${A1CLASS} + ${A2CLASS}"
            fi
          fi
          echo "$V" | tee out/verdict.txt
          echo "(report-only step: run conclusion is governed by the build/ARM steps; verdict ships in the artifact as out/verdict.txt)"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## a11y5-repro verdict"
              echo ""
              echo "$V"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Assemble evidence
        if: always()
        run: |
          mkdir -p out
          {
            echo "{"
            echo "  \"run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"run_url\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\","
            echo "  \"commit\": \"$GITHUB_SHA\","
            echo "  \"name\": \"${{ github.event.inputs.name }}\","
            echo "  \"source_rev\": \"$SRC_REV\","
            echo "  \"build_outcome\": \"${{ steps.build.outcome }}\","
            echo "  \"arm1_outcome\": \"${{ steps.arm1.outcome }}\","
            echo "  \"arm2_outcome\": \"${{ steps.arm2.outcome }}\","
            echo "  \"date_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > out/meta.json
          cp a11y5-build.log a11y5-arm1.log a11y5-arm2.log out/ 2>/dev/null || true
          cat out/meta.json
          find out -maxdepth 3 -type f | sort | head -140 || true

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y5-repro-evidence
          path: out/
          retention-days: 7
          if-no-files-found: warn
